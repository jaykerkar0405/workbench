<!doctype html>
<html lang="en">
	<head>
		<!-- Character Encoding & Viewport -->
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Fonts -->
		<link rel="preload" href="/fonts/akt.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<link rel="preload" href="/fonts/geist_mono.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

		<!-- Favicon & Icons -->
		<link rel="icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />

		<!-- Primary Meta Tags -->
		<meta name="author" content="Jay Kerkar" />
		<meta name="google-site-verification" content="UaAXkgTpfYEjEVVf-oOKudNp3VdSATdOv7tLyPyDb9M" />
		<meta
			name="keywords"
			content="Jay Kerkar, Full-Stack Developer, Web Developer, Mobile Developer, Web3 Developer, React, Svelte, SvelteKit, Node.js, TypeScript, JavaScript, Blockchain, Hackathon Winner, Software Engineer, jaykerkar0405, Portfolio"
		/>

		<!-- Open Graph / Facebook / LinkedIn (static, per-page tags set via Seo component) -->
		<meta property="og:locale" content="en_US" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Jay Kerkar Portfolio" />
		<meta property="og:image" content="%sveltekit.env.PUBLIC_SITE_URL%/icons/open-graph.png" />

		<!-- Twitter (static, per-page tags set via Seo component) -->
		<meta name="twitter:site" content="@jaykerkar0405" />
		<meta name="twitter:creator" content="@jaykerkar0405" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="%sveltekit.env.PUBLIC_SITE_URL%/icons/open-graph.png" />

		<!-- Additional Profile Links (for SEO & structured data hints) -->
		<link rel="me" href="https://t.me/jaykerkar0405" />
		<link rel="me" href="https://github.com/jaykerkar0405" />
		<link rel="me" href="https://twitter.com/jaykerkar0405" />
		<link rel="me" href="https://devfolio.co/@jaykerkar0405" />
		<link rel="me" href="https://leetcode.com/jaykerkar0405" />
		<link rel="me" href="https://linkedin.com/in/jaykerkar0405" />
		<link rel="me" href="https://discord.com/users/jaykerkar0405" />

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/sw.js');
				});
			}
		</script>
	</body>
</html>
