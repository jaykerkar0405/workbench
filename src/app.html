<!doctype html>
<html lang="en">
	<head>
		<!-- Character Encoding & Viewport -->
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Fonts -->
		<link rel="preload" href="/fonts/akt.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<link rel="preload" href="/fonts/geist_mono.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

		<!-- Favicon & Icons -->
		<link rel="icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />

		<!-- Primary Meta Tags -->
		<meta name="author" content="Jay Kerkar" />
		<meta name="google-site-verification" content="UaAXkgTpfYEjEVVf-oOKudNp3VdSATdOv7tLyPyDb9M" />
		<meta
			name="keywords"
			content="Jay Kerkar, Full-Stack Developer, Web Developer, Mobile Developer, Web3 Developer, React, Svelte, SvelteKit, Node.js, TypeScript, JavaScript, Blockchain, Hackathon Winner, Software Engineer, jaykerkar0405, Portfolio"
		/>

		<!-- Open Graph / Facebook / LinkedIn (static, per-page tags set via Seo component) -->
		<meta property="og:locale" content="en_US" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Jay Kerkar Portfolio" />
		<meta property="og:image" content="%sveltekit.env.PUBLIC_SITE_URL%/icons/open-graph.png" />

		<!-- Twitter (static, per-page tags set via Seo component) -->
		<meta name="twitter:site" content="@jaykerkar0405" />
		<meta name="twitter:creator" content="@jaykerkar0405" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="%sveltekit.env.PUBLIC_SITE_URL%/icons/open-graph.png" />

		<!-- Additional Profile Links (for SEO & structured data hints) -->
		<link rel="me" href="https://t.me/jaykerkar0405" />
		<link rel="me" href="https://github.com/jaykerkar0405" />
		<link rel="me" href="https://twitter.com/jaykerkar0405" />
		<link rel="me" href="https://devfolio.co/@jaykerkar0405" />
		<link rel="me" href="https://leetcode.com/jaykerkar0405" />
		<link rel="me" href="https://linkedin.com/in/jaykerkar0405" />
		<link rel="me" href="https://discord.com/users/jaykerkar0405" />

		<!-- Marks JS as available before first paint (scroll-reveal hidden states are scoped to html.js). It also decides, before
			first paint, whether the home load sequence runs (html.intro): only on a fresh full load of "/" (not a reload or a
			back/forward), without a hash, with motion allowed, and once per session. If storage is unavailable it does not run. -->
		<script>
			(function () {
				var root = document.documentElement;
				root.classList.add('js');
				try {
					var nav = performance.getEntriesByType('navigation')[0];
					if (
						location.pathname === '/' &&
						!location.hash &&
						(!nav || nav.type === 'navigate') &&
						matchMedia('(prefers-reduced-motion: no-preference)').matches &&
						!sessionStorage.getItem('intro')
					) {
						sessionStorage.setItem('intro', '1');
						root.classList.add('intro');
					}
				} catch (e) {}
			})();
		</script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<!-- No-JS only. The 404.html fallback shell's container holds just the boot script; any prerendered page has
			elements in it and hides this. Self-contained: the stylesheet does not apply to a shell. -->
		<!-- prettier-ignore -->
		<noscript>
			<style>
				@font-face { font-family: 'Akt'; font-weight: 100 900; src: url('/fonts/akt.woff2') format('woff2'); }
				div[style='display: contents']:has(> :not(script)) ~ noscript .no-js-404 { display: none; }
				.no-js-404 { max-width: 40rem; margin: 0 auto; padding: 5rem 1.25rem; font: 1.125rem/1.6 'Akt', system-ui, sans-serif; color: oklch(0.2 0.02 255); }
				@media (prefers-color-scheme: dark) { html { background: oklch(0.16 0.012 255); } .no-js-404 { color: oklch(0.96 0.005 250); } }
			</style>
			<p class="no-js-404">This page needs JavaScript, or the address does not exist. <a href="/" style="color: inherit">Go to the homepage</a>.</p>
		</noscript>

		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/sw.js');
				});
			}
		</script>
	</body>
</html>
